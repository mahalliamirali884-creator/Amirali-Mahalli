<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#d3d6db">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#d3d6db;--bgimg:linear-gradient(180deg,#e6e8ec 0%,#c8ccd2 30%,#dcdfe3 55%,#b9bec6 100%);--ink:#161b22;--mute:#434b56;--line:#aab0b9;--acc:#0f8f8a;--accInk:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--bgimg:linear-gradient(180deg,#2a2d32 0%,#3d4148 30%,#25282d 55%,#44484f 100%);--ink:#eef1f6;--mute:#9aa4bb;--line:#26304a;--acc:#2cc4bd;--accInk:#0e1424}}
:root[data-theme="dark"]{--bg:#0e1424;--bgimg:linear-gradient(180deg,#2a2d32 0%,#3d4148 30%,#25282d 55%,#44484f 100%);--ink:#eef1f6;--mute:#9aa4bb;--line:#26304a;--acc:#2cc4bd;--accInk:#0e1424}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:var(--bgimg);background-attachment:fixed;color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.8}
main{max-width:480px;margin:0 auto;padding-bottom:32px}
.hero{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center top;border-radius:0 0 36px 36px;background:var(--line)}
h1{margin:16px 20px 0;font-size:24px;font-weight:800;text-align:center}
.name{margin:0;text-align:center;color:var(--mute);font-weight:600}
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:16px 20px 0}
.langs button{font:600 14px Vazirmatn,Tahoma,Arial,sans-serif;padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.actions{display:flex;gap:10px;padding:20px}
.btn{flex:1;text-align:center;padding:12px;border-radius:14px;font:600 16px Vazirmatn,Tahoma,Arial,sans-serif;text-decoration:none;background:var(--acc);color:var(--accInk);border:0;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
ul{list-style:none;margin:0;padding:0 20px}
li a{display:flex;align-items:center;gap:14px;padding:12px 4px;color:var(--ink);text-decoration:none;flex:1;min-width:0}
li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.cp{flex:none;width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;display:grid;place-items:center}.cp svg{width:18px;height:18px;fill:currentColor}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 20px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90%}#toast.on{opacity:1}
.txt{display:flex;flex:1;min-width:0;justify-content:space-between;align-items:center;gap:12px}.txt span:first-child{color:var(--mute)}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.18)}.ic svg{width:22px;height:22px;fill:currentColor}
.hw{position:relative}.hw::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;border-radius:0 0 36px 36px;background:linear-gradient(transparent,rgba(8,12,24,.85));pointer-events:none}
.hw h1{position:absolute;z-index:1;inset-inline:22px;bottom:22px;margin:0;color:#fff;font-size:36px;text-align:start;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.tg{position:absolute;z-index:2;top:16px;inset-inline-end:16px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;font-size:19px;cursor:pointer;backdrop-filter:blur(6px)}
.hw::before{content:"";position:absolute;inset:0;z-index:1;border-radius:0 0 36px 36px;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.3) 48%,transparent 60%);background-size:250% 100%;background-position:150% 0;animation:shine 6s ease-in-out 1.2s infinite;pointer-events:none}
@keyframes shine{0%,65%{background-position:150% 0}100%{background-position:-50% 0}}
.gr{position:absolute;z-index:2;top:16px;inset-inline-start:16px;height:42px;padding:0 16px;display:flex;align-items:center;border-radius:99px;background:rgba(0,0,0,.4);color:#fff;font-size:14px;backdrop-filter:blur(6px)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(30,170,160,.5)}70%,100%{box-shadow:0 0 0 14px rgba(30,170,160,0)}}
.actions .btn:not(.alt){animation:ring 2.4s ease-out 1.5s infinite}
.ft{display:flex;justify-content:center;align-items:center;gap:8px;padding:28px 20px 8px;color:var(--mute);font-size:13px}.ft svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.ft path{animation:wave 1.8s infinite}.ft path:nth-child(2){animation-delay:.3s}.ft path:nth-child(3){animation-delay:.6s}
@keyframes wave{0%,100%{opacity:.25}50%{opacity:1}}
.btn{transition:transform .15s}.btn:active{transform:scale(.96)}li a{transition:background .2s}li a:active{background:rgba(127,127,127,.15);border-radius:12px}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;mix-blend-mode:soft-light;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 45%,transparent 60%);background-size:300% 100%;animation:sheen 12s linear infinite}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
.sw{display:flex;flex-wrap:wrap;gap:10px;padding:20px 20px 0}.sw .btn{flex:1 1 40%}

.hw{overflow:hidden;border-radius:0 0 36px 36px}
#dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);display:flex;gap:10px;padding:8px;border-radius:99px;background:rgba(20,24,30,.6);backdrop-filter:blur(10px);z-index:8;transition:transform .35s}#dock.on{transform:translate(-50%,0)}#dock a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}#dock svg{width:22px;height:22px;fill:currentColor}
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);background-image:var(--bgimg);color:var(--ink);animation:introOut .6s ease 3.6s forwards;cursor:pointer}#intro svg{width:84px;height:84px;fill:none;stroke:var(--acc);stroke-width:1.6;stroke-linecap:round}#intro path{animation:wave 1.2s infinite}#intro path:nth-child(2){animation-delay:.2s}#intro path:nth-child(3){animation-delay:.4s}#intro p{margin:0;font-size:26px;font-weight:800}
@keyframes introOut{to{opacity:0;visibility:hidden}}
.tm{margin:-6px 0 0;text-align:center;font-size:13px;color:var(--mute)}
#intro p.hi{font-size:20px;font-weight:600;color:var(--mute)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.035) 1px 2px,transparent 2px 4px)}
.hw{box-shadow:0 14px 34px rgba(0,0,0,.28);touch-action:manipulation}
#sheet textarea{font:16px Vazirmatn,Tahoma,Arial,sans-serif;resize:vertical}
.ic{font-size:15px}
.sec{margin:0 20px 14px;padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.18);backdrop-filter:blur(4px)}.sec h3{margin:0 0 6px;font-size:14px;color:var(--mute);font-weight:600}.sec p{margin:0;white-space:pre-wrap}
.tags{display:flex;flex-wrap:wrap;gap:8px}.tags span{background:var(--acc);color:var(--accInk);padding:2px 14px;border-radius:99px;font-size:14px;animation:up .5s both}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.gal img{flex:none;width:140px;height:140px;object-fit:cover;border-radius:14px;scroll-snap-align:start;cursor:pointer;transition:transform .2s}.gal img:active{transform:scale(.96)}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}
.btn{position:relative;overflow:hidden}.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(4);opacity:0}}
#lb{border:0;padding:0;background:transparent;max-width:96vw;max-height:92vh}#lb::backdrop{background:rgba(0,0,0,.8)}#lb img{display:block;max-width:96vw;max-height:90vh;border-radius:12px}
#top{position:fixed;top:0;left:0;right:0;z-index:7;display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:rgba(20,24,30,.62);backdrop-filter:blur(10px);color:#fff;transform:translateY(-110%);transition:transform .35s}#top.on{transform:none}#top img{width:36px;height:36px;border-radius:50%;object-fit:cover}#top b{flex:1;font-size:16px}#top .btn{flex:none;padding:6px 14px;font-size:14px;border-radius:12px;animation:none}
#bar{position:fixed;top:0;inset-inline-start:0;height:3px;width:0;background:var(--acc);z-index:9;pointer-events:none}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none}
.notice{margin:16px 20px 0;padding:12px 16px;border-radius:14px;background:var(--acc);color:var(--accInk);text-align:center;font-weight:600}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.langs,.actions,li{animation:up .55s both}
.hero{animation:up .7s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
li a .txt span:last-child{font-weight:600;direction:ltr;unicode-bidi:plaintext;text-align:end;overflow-wrap:anywhere}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#sheet{width:min(480px,100%);max-height:92vh;margin:auto;border:0;border-radius:24px;padding:20px;background:var(--bg);color:var(--ink);font-family:inherit}
#sheet::backdrop{background:rgba(0,0,0,.5)}
#sheet h2{margin:0 0 12px;font-size:20px}
label{display:block;font-size:14px;color:var(--mute);margin-top:10px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:16px Vazirmatn,Tahoma,Arial,sans-serif}
select option{color:#000}
.ltr{direction:ltr;text-align:left}
.row{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px;display:grid;gap:6px}
.row .btn{padding:6px;font-size:14px}
.bar{display:flex;gap:10px;margin-top:16px}
#msg{color:var(--mute);font-size:14px;margin:8px 0 0;min-height:1.5em}
</style>
</head>

  const gt=el('div','gal');

  gf.onchange=()=>{[...gf.files].slice(0,8-draft.gallery.length).forEach(f=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);draft.gallery.push(c.toDataURL('image/jpeg',.78));drawG()};im.src=fr.result};fr.readAsDataURL(f)})};
  const rows=el('div');
  const addRow=l=>{
    const r=el('div','row');
    const tl=el('label',0,'نوع'),sel=el('select');
    ['mobile','email','telegram','instagram','whatsapp','linkedin','youtube','x','tiktok','snapchat','facebook','github','discord','spotify','eitaa','rubika','website','location'].forEach(k=>{const o=el('option',0,L.fa[k]);o.value=k;if(k===l.type)o.selected=true;sel.append(o)});
    tl.append(sel);
    const [b,val]=field('متن نمایشی',l.value,1),[c,href]=field('لینک (https:// یا tel: یا mailto:)',l.href,1);
    const del=el('button','btn alt','حذف این مورد');del.type='button';del.onclick=()=>r.remove();
    r.append(tl,b,c,del);r._g=()=>({type:sel.value,value:val.value.trim(),href:href.value.trim()});rows.append(r);
  };
  draft.links.forEach(addRow);
  const add=el('button','btn alt','افزودن مورد جدید');add.type='button';add.onclick=()=>addRow({type:'website',value:'',href:'https://'});
  const msg=el('p');msg.id='msg';
  const save=el('button','btn','ذخیره و انتشار'),cancel=el('button','btn alt','انصراف');
  cancel.onclick=()=>sh.close();
  save.onclick=async()=>{
    const next={name:nf[0][1].value.trim(),names:Object.fromEntries(nf.slice(1).map(x=>[x[2],x[1].value.trim()])),photo:draft.photo,notice:nin.value.trim(),about:ai.value.trim(),skills:sk.value.split(/[,،]/).map(x=>x.trim()).filter(Boolean),gallery:draft.gallery,links:[...rows.children].map(r=>r._g()).filter(x=>x.value)};
    save.disabled=true;msg.textContent='در حال ذخیره...';
    try{await artifact.publish(buildDoc(next))}
    catch(e){save.disabled=false;msg.textContent=e&&e.code==='conflict'?'نسخه جدیدتری منتشر شده؛ صفحه دوباره بارگذاری می‌شود.':'ذخیره نشد. دوباره تلاش کنید.'}
  };
  const bar=el('div','bar');bar.append(save,cancel);
  sh.append(el('h2',0,'ویرایش اطلاعات'),...nf.map(x=>x[0]),nl,pl,al,sl,gl,gt,rows,add,msg,bar);
  sh.showModal();
}

render();intro();bar();fx();
(async()=>{
  try{
    const user=await claude.use('user'),artifact=await claude.use('artifact');
    if(user&&artifact&&(user.isOwner()||user.canEdit())){
      const go=()=>openEditor(artifact);
      if(location.hash==='#edit')go();
      addEventListener('hashchange',()=>{if(location.hash==='#edit')go()});
      let n=0,t;
      $('#app').addEventListener('click',e=>{
        if(!e.target.closest('.hero'))return;
        n++;clearTimeout(t);t=setTimeout(()=>{n=0},1500);
        if(n>=5){n=0;go()}
      });
    }
  }catch(e){}
})();
</script>
</body>
